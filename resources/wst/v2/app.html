 return ''}function saveGender(g){try{const u=PP&&PP.eval('typeof user!=="undefined"?user:null');if(u){u.gender=g;PP.save('user',u)}}catch(e){}
 try{const u=pUser();u.gender=g;pSave('user',u);const p=JSON.parse(localStorage.getItem(PROFILES_KEY)||'{}')||{},k=String(u.email||'').trim().toLowerCase();if(k){p[k]={...(p[k]||{}),gender:g};localStorage.setItem(PROFILES_KEY,JSON.stringify(p))}}catch(e){}}/* ---------- learner state, one record per grade ---------- */

const SFX={whistle(){[784,988,1175].forEach(f=>tone(f,0,1.2,'sine',.04))},chuff(n=4){for(let i=0;i<n;i++)noise(i*.28,.18,.05,500)},pop(){tone(660,0,.1,'square',.022)},tick(){tone(1200,0,.06,'sine',.04)},buzz(){tone(180,0,.25,'sawtooth',.03)},fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.5,'triangle',.05));tone(1047,.6,.9,'triangle',.045)},stamp(){noise(0,.12,.12,300)}};

/* Fixed layout: toolbar on top, the ticket box under it, centred with an even margin. */
function wstLayout(){const W=innerWidth,H=innerHeight,m=Math.max(8,Math.min(W,H)*.022),bh=Math.max(36,Math.min(72,H*.08)),g=Math.max(8,bh*.28);

const GATE_MIN=60;

 const srcText=[t.prompt,...t.sources.flatMap(s=>[s.title,...s.paras.map(p=>p.t)])].join(' ').toLowerCase(),srcW=srcText.match(/[a-z']+/g)||[];

 const refs=new Set();(text.match(/source\s*(\d)/gi)||[]).forEach(m=>refs.add(+m.replace(/\D/g,'')));
 t.sources.forEach((s,i)=>{if(text.toLowerCase().includes(s.title.toLowerCase().slice(0,22)))refs.add(i+1)});
 const quoted=(text.match(/[“"][^”"]{3,}[”"]/g)||[]).join(' '),own=text.replace(/[“"][^”"]{3,}[”"]/g,' ').toLowerCase().match(/[a-z']+/g)||[];
 const grams=new Set();for(let i=0;i+7<=srcW.length;i++)grams.add(srcW.slice(i,i+7).join(' '));let cp=0;for(let i=0;i+7<=own.length;i++)if(grams.has(own.slice(i,i+7).join(' ')))cp++;
 return {t,text,paras,wl,wc,sents,keys,used,refs,quoted,copied:own.length>=7?cp/(own.length-6):0,trans:new Set((text.match(TRANS)||[]).map(s=>s.toLowerCase()))}}
