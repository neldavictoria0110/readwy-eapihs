<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>READwy Reading Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070e16;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:#1d2440;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
:root{--toolbar-h:0px;--toolbar-h-art:0px}
#world{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;background:#070e16}
.scene::before{content:"";position:absolute;inset:-3%;background-image:var(--scene-bg);background-size:cover;background-position:center;filter:blur(22px) brightness(.42) saturate(.8);transform:scale(1.04);pointer-events:none}
.scene.leave{animation:sceneOut .32s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none;z-index:2}
.scene.enter{animation:sceneIn .42s cubic-bezier(.2,.9,.3,1.03) both}
@keyframes sceneOut{to{opacity:0;transform:scale(1.04);filter:brightness(1.3)}}
@keyframes sceneIn{from{opacity:0;transform:scale(.97)}}
.plate{position:absolute;overflow:hidden}
.plate>.art{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
/* Native journey page: one scenery layer, then independent HTML stations and controls. */
.scene.native-journey{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#101a31}
.scene.native-journey::-webkit-scrollbar{display:none}
.scene.native-journey::before{inset:0;background-size:cover;filter:blur(9px) brightness(.38) saturate(.7);transform:scale(1.04)}
.scene.native-journey::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(135deg,rgba(10,20,42,.34),rgba(16,28,54,.48))}
.scene.native-journey .plate{position:relative;z-index:1;overflow:visible;min-height:100dvh}
.scene.native-journey .plate>.art{display:none}
.scene.safe-fit{background:#17233d}
.scene.safe-fit::before{display:none!important}
.scene.safe-fit .plate{z-index:1}
.safe-extension{position:absolute;z-index:0;overflow:hidden;pointer-events:none;background-repeat:no-repeat;}
.journey-shell{width:100%;min-height:100dvh;padding:10px clamp(12px,2vw,32px) 18px;display:flex;flex-direction:column;gap:10px;color:#f7f2e3}
.journey-topbar{position:relative;min-height:52px;display:flex;align-items:center;gap:clamp(10px,2vw,26px);padding:7px 14px;border:1px solid #d9a441aa;border-radius:16px;background:rgba(20,35,67,.99);box-shadow:0 5px 18px #0005}
.journey-brand{color:#f1d58a;font:700 clamp(15px,1.5vw,21px)/1.1 Fredoka,Nunito,sans-serif;white-space:nowrap}
.journey-nav{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.8vw,12px);flex:1;min-width:0}
.journey-nav button,.journey-self,.journey-progress button{font:700 14px/1.1 Nunito,sans-serif}
.journey-nav button{min-height:34px;padding:6px 12px;border:1px solid transparent;border-radius:999px;color:#f5e8be;background:transparent;transition:background .1s,color .1s,transform .1s;white-space:nowrap}
.journey-nav button:hover,.journey-nav button:focus-visible{background:#d9a441;color:#15213e;transform:translateY(-1px)}
.journey-self{padding:8px 13px;border-radius:999px;color:#183050;background:#e6efce;border:1px solid #fff6dc;white-space:nowrap}
.journey-heading{text-align:center;align-self:center;max-width:min(900px,96vw);padding:9px 26px 10px;border:2px solid #d9a441;border-radius:24px;background:linear-gradient(135deg,rgba(20,35,67,.97),rgba(29,48,85,.96));box-shadow:0 7px 20px #0006}
.journey-heading h1{margin:0;color:#fff8e5;font:700 clamp(22px,2.35vw,34px)/1.05 Fredoka,Nunito,sans-serif}
.journey-heading p{margin:4px 0 0;color:#f1d58a;font:700 clamp(12px,1.2vw,17px)/1.2 Nunito,sans-serif}
.journey-grid{position:relative;isolation:isolate;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(9px,1.25vw,18px);padding:4px 1px}
.journey-rail{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible}
.journey-station{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.journey-crop{position:relative;width:clamp(112px,21vh,213px);max-width:100%;height:clamp(75px,14vh,142px);aspect-ratio:1.5;flex:none;overflow:hidden;border:2px solid #e6c36a;border-radius:18px;background-color:#142345;box-shadow:0 8px 20px #0007;background-repeat:no-repeat}
.journey-crop:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(10,20,40,.72));pointer-events:none}
.journey-train{filter:drop-shadow(0 2px 3px #0009)}
.journey-train svg{display:block;width:100%;height:100%}
.journey-card{width:min(100%,430px);min-height:160px;flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding:clamp(7px,.8vw,12px) clamp(9px,1vw,15px);border:2px solid var(--station-color);border-radius:17px;color:#17223d;background:linear-gradient(150deg,#fffdf7,#f4eddd);box-shadow:0 7px 18px #0005;font-size:clamp(12px,1vw,16px)}
.journey-card-head{display:flex;align-items:center;justify-content:space-between;gap:7px}
.journey-gem-name{font:700 clamp(16px,1.35vw,21px)/1.1 Fredoka,Nunito,sans-serif;color:#17223d}
.journey-badge{flex:none;padding:4px 8px;border-radius:999px;background:#e8edf6;color:#24365c;font-size:.76em;font-weight:900;white-space:nowrap}
.journey-metric{display:grid;grid-template-columns:68px minmax(20px,1fr) 34px;align-items:center;gap:7px;font-weight:800}
.journey-meter{height:8px;overflow:hidden;border-radius:999px;background:#d9dee8;box-shadow:inset 0 1px 2px #0002}
.journey-meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#64c43b,#268a21)}
.journey-meter.blue i{background:linear-gradient(90deg,#64a7ff,#2860d5)}
.journey-action{width:100%;min-height:34px;margin-top:auto;border:1px solid #c69436;border-radius:999px;background:linear-gradient(#ffe783,#f6bd28 60%,#e99b0b);color:#211800;font:700 14px/1 Nunito,sans-serif;box-shadow:0 2px 0 #a86d12;transition:filter .1s,transform .1s;cursor:pointer}
.journey-action:hover:not(:disabled),.journey-action:focus-visible{filter:brightness(1.07);transform:translateY(-1px)}
.journey-action:active:not(:disabled){transform:scale(.98)}
.journey-action.secondary{background:linear-gradient(#fffdf7,#eee5d3);color:#1c2948}
.journey-action:disabled{color:#635c50;background:#ddd8ce;border-color:#c6beb1;box-shadow:none;cursor:not-allowed}
.journey-progress-tab{position:fixed!important;right:0!important;top:38vh!important;z-index:91!important;width:31px!important;height:118px!important;padding:0!important;border:1px solid #e2b24c!important;border-right:0!important;border-radius:12px 0 0 12px!important;background:rgba(20,35,67,.96)!important;color:#fff6dc!important;box-shadow:-4px 0 14px #0005!important;touch-action:none!important;cursor:grab!important}
.journey-progress{color:#1d2440!important;background:linear-gradient(150deg,#fffdf7,#eee4cf)!important;border:1px solid #d9a441!important;border-radius:20px 0 0 20px!important;box-shadow:-12px 0 34px #0008!important}
.journey-progress-inner{padding:clamp(16px,3vw,28px);padding-right:44px;font:600 15px/1.35 Nunito,sans-serif}
.journey-progress h2{margin:0;font:700 27px/1 Fredoka,Nunito,sans-serif;color:#14254a}
.journey-progress h3{margin:18px 0 8px;font:700 17px/1.1 Fredoka,Nunito,sans-serif;color:#14254a}
.journey-progress .progress-stat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0}
.journey-progress .progress-bar{grid-column:1/-1;height:9px;background:#dfe3ea;border-radius:99px;overflow:hidden}
.journey-progress .progress-bar i{display:block;height:100%;background:linear-gradient(90deg,#73ce44,#2f8f10)}
.journey-progress .progress-task{padding:12px;border-radius:14px;background:#e6eefc;border:1px solid #b9ccec}
.journey-progress .prog-close{display:grid;place-items:center;flex:none;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:#22396b;color:#fff6dc;font:700 28px/1 sans-serif;cursor:pointer}
.scene.native-journey #caption{position:relative;left:auto;top:auto;bottom:auto;transform:none;z-index:30;max-width:min(820px,90vw);margin:0 auto;cursor:pointer;pointer-events:auto;font-size:clamp(12px,1.3vh,16px);padding:5px 12px}
@media(max-width:900px){
 .scene.native-journey{overflow-y:auto}
 .journey-shell{min-height:100dvh;padding:8px 10px 24px;gap:8px}
 .journey-topbar{min-height:unset;flex-wrap:wrap;gap:5px;padding:8px}
 .journey-brand{width:100%;text-align:center;font-size:17px}
 .journey-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));order:2;width:100%;justify-content:stretch;overflow:visible;padding-bottom:0}
 .journey-nav button{font-size:12px;padding:7px 5px;white-space:normal}
 .journey-self{position:static;order:1;margin:0 auto 0 0;font-size:11px}
 .journey-heading{padding:7px 16px;width:100%}
 .journey-heading h1{font-size:23px}
 .journey-heading p{font-size:12px}
 .journey-grid{display:flex;flex-direction:column;gap:12px;flex:none;padding:0 0 8px}
 .journey-rail{display:none}
 .journey-station{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;min-height:0}
 .journey-crop{width:min(100%,240px);height:auto;max-height:150px;min-height:0;aspect-ratio:1.5;align-self:center;border-radius:14px}
 .journey-card{width:min(calc(100vw - 40px),430px);max-width:100%;min-width:0;min-height:124px;padding:8px 9px;gap:4px;border-radius:14px;font-size:12px}
 .journey-card-head{gap:3px}
 .journey-gem-name{font-size:14px}
 .journey-badge{font-size:9px;padding:3px 5px}
 .journey-metric{grid-template-columns:58px minmax(14px,1fr) 30px;gap:5px;font-size:11px}
 .journey-action{min-height:29px;font-size:12px}
 .scene.native-journey #caption{left:auto;right:auto;top:auto;bottom:auto;max-width:none;width:100%}
}
@media(min-width:901px) and (max-height:820px){.journey-crop{width:clamp(114px,18vh,158px);height:clamp(76px,12vh,105px)}.journey-card{min-height:148px}}
@media(max-width:420px){.journey-self{padding:6px 8px}}
/* Background extensions retained for old scene markup; the current viewport underlay uses a blurred copy. */
.ext{position:absolute;background-repeat:no-repeat;pointer-events:none}
.ext::after{content:"";position:absolute;inset:0}

.ext.l::after{background:linear-gradient(90deg,rgba(20,12,24,.18),rgba(20,12,24,0))}
.ext.r::after{background:linear-gradient(90deg,rgba(20,12,24,0),rgba(20,12,24,.18))}
.ext.t::after{background:linear-gradient(180deg,rgba(20,12,24,.18),rgba(20,12,24,0))}
.ext.b::after{background:linear-gradient(180deg,rgba(20,12,24,0),rgba(20,12,24,.18))}
.abs{position:absolute}
.clone{position:absolute;background-repeat:no-repeat;pointer-events:none}
.feather{-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-composite:intersect}
/* live content painted over the cards (1 art pixel = var(--k)) */
.box{position:absolute;overflow:hidden;line-height:1.25}
.cream{background:radial-gradient(ellipse at 50% 50%,#fdfaf3,#fbf6ea 70%,#f9f2e2);border-radius:.6em}
.hit{position:absolute;border:0;padding:0;background:transparent;border-radius:.6em;transition:transform .18s,filter .18s,box-shadow .2s;z-index:3}
.hit:hover{filter:brightness(1.1);box-shadow:0 0 0 calc(3*var(--k)) #ffe27a99,0 0 calc(24*var(--k)) #ffd34d88}
.hit:active{transform:scale(.97)}
.hit:focus-visible,.pill:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid #ffb700;outline-offset:2px}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;gap:.35em;border-radius:999px;font-family:Fredoka,Nunito,sans-serif;font-weight:600;white-space:nowrap;border:0;padding:0 .8em;z-index:3;transition:transform .15s,filter .15s}
.pill:hover{transform:translateY(-1px) scale(1.03);filter:brightness(1.07)}
.tbbtn{color:transparent;background:transparent;transition:filter .18s,outline-color .18s}.tbbtn:hover,.tbbtn:focus-visible{background:transparent;color:transparent;filter:none;box-shadow:none}.tbbtn:focus-visible{outline:3px solid #ffb700;outline-offset:-3px}
.tbbtn:hover [fill='#f6ecd4'],.tbbtn:focus-visible [fill='#f6ecd4']{fill:#1d1400}.tbbtn:hover [stroke='#f6ecd4']{stroke:#1d1400}
/* painted toolbar buttons on the other pages also glow yellow under the pointer */
.hit.nav:hover{background:rgba(255,214,71,.5);mix-blend-mode:screen;box-shadow:0 0 calc(14*var(--k)) #ffd447}
.gold{background:linear-gradient(#ffe27a,#fbc531 55%,#f2a50c);color:#241600;box-shadow:inset 0 .12em 0 #fff8,0 .14em 0 #b06d00,0 .3em .6em #0004;border:.08em solid #fff0b8}
.goldtxt{background:linear-gradient(#fed65a,#fcc631 55%,#f9b81f);color:#1c1300;font-family:Fredoka,sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;gap:.3em;border-radius:999px;pointer-events:none}
.ghost{background:linear-gradient(#fffaf0,#f6ebd2);color:#1d2440;border:.08em solid #d9b46a;box-shadow:0 .12em 0 #c49a52}
.navy{background:linear-gradient(#22396b,#11234a);color:#fff;border:.08em solid #e2b24c}
.green{background:linear-gradient(#3b8f1c,#256d0b);color:#fff}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.08em .6em;border-radius:999px;font-weight:800;white-space:nowrap}
.cg{background:#e6f0cc;color:#1f4d0f}.cb{background:#dce8ff;color:#173c8a}.cl{background:#ece7dc;color:#5a5348}.cy{background:#fff1c2;color:#6b4a00}
.bar{position:relative;height:.6em;border-radius:99px;background:#dfe3ea;overflow:hidden;box-shadow:inset 0 .06em .15em #0002}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(#5cc22b,#2f8f10);transition:width 1s cubic-bezier(.3,.9,.3,1)}
.bar.blue>i{background:linear-gradient(#3d8bff,#1557d6)}
.gem{display:inline-block;width:1em;height:1em;flex:none;clip-path:polygon(50% 100%,0 38%,18% 8%,82% 8%,100% 38%);background:var(--g);box-shadow:inset 0 0 .3em #fff8;position:relative}
.ttl{font-family:Fredoka,Nunito,sans-serif;font-weight:700;color:#0e1838;line-height:1.05}
.muted{color:#5b5f6e}.ital{font-style:italic}
.card{position:absolute;border-radius:.7em;background:linear-gradient(#fffdf7,#fbf4e4);border:.1em solid #e0c88f;box-shadow:0 .15em .4em #6b4a1c33;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;overflow:hidden;text-align:center;padding:0;cursor:pointer;z-index:3}
.card:hover{transform:translateY(-4%) scale(1.04);box-shadow:0 .6em 1.2em #6b4a1c55,0 0 0 .12em #ffd34d}
.card.locked{cursor:not-allowed}.card.locked:hover{transform:rotate(-1deg)}.card.locked .num{background:#555!important}
.card.now{border-color:#2f8f10;box-shadow:0 0 0 .1em #2f8f10,0 0 1em #7ee08188;animation:breatheCard 2.4s ease-in-out infinite}
@keyframes breatheCard{50%{box-shadow:0 0 0 .14em #2f8f10,0 0 1.6em #7ee081}}
.thumb{position:relative;display:grid;place-items:center;overflow:hidden}
.thumb b{font-size:2.4em;display:inline-flex;filter:drop-shadow(0 .08em .1em #0005)}
/* swipe from right to left (next) or left to right (back) for passage pages and questions */
.swR{animation:swR .42s cubic-bezier(.2,.8,.25,1) both}.swL{animation:swL .42s cubic-bezier(.2,.8,.25,1) both}
@keyframes swR{from{transform:translateX(18%);opacity:0}}@keyframes swL{from{transform:translateX(-18%);opacity:0}}
@keyframes floaty{50%{transform:translateY(-6%) rotate(-3deg)}}
.num{position:absolute;left:.3em;top:.3em;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-family:Fredoka;font-weight:700;color:#fff;background:#2f7d14;border:.1em solid #fff;box-shadow:0 .1em .2em #0005}
.lockb{position:absolute;right:.3em;top:.3em;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:#2b2b33cc;font-size:.85em}
/* owls, steam, glow, sparkles */
/* owls: blink and jump in place (no breathing, no talking motion) */
.gemcut{transform-origin:50% 60%;animation:gemPulse 2.6s ease-in-out infinite;transition:transform .3s}
@keyframes gemPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.1);filter:brightness(1.25) saturate(1.2)}}
.gemcut.hot{animation:gemHot .7s ease-in-out infinite}@keyframes gemHot{0%,100%{transform:scale(1.15);filter:brightness(1.3)}50%{transform:scale(1.25) rotate(0deg);filter:brightness(1.5) saturate(1.3)}}
.hit.stn:hover{box-shadow:none;filter:none}
.owlwrap{transform-origin:50% 100%;animation:hop 2.8s ease-in-out infinite;z-index:1}
.trainwrap{transform-origin:60% 100%;animation:engineRun .34s steps(2) infinite;z-index:1}
/* engine running: a steady rumble, as if the train has started and is about to leave */
.locorumble{transform-origin:50% 100%;animation:engineRun .34s steps(2) infinite}
@keyframes engineRun{0%{transform:translate(0,0)}25%{transform:translate(.06%,-.35%)}50%{transform:translate(-.05%,0)}75%{transform:translate(.04%,-.25%) rotate(.12deg)}100%{transform:translate(0,0)}}
@keyframes trainShake{0%,100%{transform:translate(0,0)}4%{transform:translate(.08%,-.12%) rotate(.12deg)}8%{transform:translate(-.08%,.06%)}12%{transform:translate(.06%,-.1%) rotate(-.1deg)}16%{transform:translate(0,0)}50%{transform:translate(0,0)}53%{transform:translate(.1%,-.16%) rotate(.15deg)}56%{transform:translate(-.1%,.08%) rotate(-.12deg)}59%{transform:translate(.08%,-.14%)}62%{transform:translate(-.06%,.06%)}65%{transform:translate(0,0)}}
#trainfx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#trainfx img{position:absolute;bottom:6vh;height:62vh;width:auto;filter:drop-shadow(0 2vh 2vh rgba(0,0,0,.45));will-change:transform}
#trainfx i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,rgba(250,248,255,.92) 45%,rgba(245,245,252,0) 70%);animation:trainPuff 1.4s ease-out forwards}
@keyframes trainPuff{0%{transform:scale(.35);opacity:.95}100%{transform:scale(2.4) translateY(-30%);opacity:0}}
/* crouch, spring up (stretch), land with a little squash — the copy is always at least as large as the painted owl */
/* a bounce in place: crouch, spring tall, land with a squash — never smaller than the painted owl, so nothing behind it shows */
@keyframes hop{0%,50%,100%{transform:scale(1,1)}57%{transform:scale(1.05,1)}66%{transform:scale(1,1.075)}74%{transform:scale(1,1.035)}82%{transform:scale(1.045,1)}90%{transform:scale(1,1.015)}}

@keyframes bobTalk{50%{transform:translateY(-1.2%) rotate(-.6deg)}}
.lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fbf3e8,#ecdcc6 60%,#c9ab88);box-shadow:inset 0 -.12em 0 #5a3a1c;transform:scaleY(0);transform-origin:50% 0;animation:blink 4.2s infinite}
@keyframes blink{0%,88%,100%{transform:scaleY(0)}91%,93%{transform:scaleY(1)}96%{transform:scaleY(0)}}
.puff{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(236,236,244,.55) 55%,rgba(230,230,240,0) 72%);animation:puff 3.4s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:0;transform:scale(.3)}12%{opacity:.9}100%{opacity:0;transform:translate(-30%,-220%) scale(2.6)}}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,236,170,.8),rgba(255,190,90,.3) 42%,rgba(255,180,80,0) 70%);animation:flicker 2.6s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.75;transform:scale(1)}35%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.07)}}
.spark{position:absolute;pointer-events:none;color:#fff6c2;text-shadow:0 0 .5em #ffd76a;animation:spark 2.8s ease-in-out infinite;opacity:0}
@keyframes spark{40%{opacity:1;transform:scale(1.25) rotate(35deg)}80%{opacity:0;transform:scale(.4) rotate(80deg)}}
.dust{position:absolute;width:.45%;aspect-ratio:1;border-radius:50%;background:#fff6d0;box-shadow:0 0 .5em #ffe9a8;pointer-events:none;opacity:0;animation:dust linear infinite}
@keyframes dust{10%{opacity:.85}90%{opacity:.5}to{opacity:0;transform:translate(2em,-14em)}}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,rgba(255,240,200,0) 0 6%,rgba(255,240,200,.35) 8%,rgba(255,240,200,0) 11% 22%);background-size:220% 100%;animation:rays 16s linear infinite}

.rl-nav button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px clamp(8px,.75vw,14px);border:1px solid transparent;border-radius:999px;background:transparent;color:#fff8e6;font:800 clamp(16px,1.05vw,17px)/1 Nunito,sans-serif;white-space:nowrap;transition:background .12s,color .12s,transform .12s}
.rl-nav button:hover,.rl-nav button:focus-visible{background:#d9a441;color:#15213e;transform:translateY(-1px);outline:none}
.rl-nav .rl-self{background:#e6efce;color:#183050;border-color:#fff1be}
.rl-nav .rl-back{border-color:#e2b24c;color:#ffe9a8}
.rl-nav svg{flex:none}
@media(max-width:1180px) and (min-width:761px){.rl-nav button{padding:6px 7px}.rl-brand-text{font-size:20px}}
@media(max-width:760px){
 .rl-topbar{flex-wrap:wrap;row-gap:4px;padding:6px 8px}
 .rl-brand{width:100%;justify-content:center}
 .rl-nav{flex:1 1 100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 .rl-nav::-webkit-scrollbar{display:none}

/* native scene: station backdrop, never stretched, no side bars */
.scene.rl-native{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#24324f url(resources/sra/v3/station-bg.jpg) center/cover no-repeat}
.scene.rl-native::-webkit-scrollbar{display:none}
.scene.rl-native::before,.scene.rl-native::after{display:none!important;content:none!important}
.scene.rl-native .plate{position:relative;z-index:1;background:transparent}
.scene.rl-native .plate>.art,.scene.rl-native .safe-extension{display:none!important}
.rl-page{position:relative;width:100%;min-height:100dvh;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);padding:8px clamp(10px,1.6vw,28px) clamp(10px,2vh,22px);color:#fff8e6}
/* ---------- Page 1: welcome ---------- */
.rl-w-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);align-items:center}
.rl-w-owl{align-self:stretch;display:flex;align-items:flex-end;justify-content:flex-end;padding-right:clamp(0px,2vw,40px);min-height:0}
.rl-w-owl .rl-owl{display:block;height:min(66vh,100%);max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.rl-w-right{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.5vh,18px);padding:clamp(4px,1vh,12px) 0}
.rl-w-right::before{content:'';position:absolute;inset:-2% -4%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(12,22,46,.35),rgba(12,22,46,.2) 62%,rgba(12,22,46,0))}
.rl-crest{position:relative;width:min(100%,900px);margin-bottom:clamp(18px,2.6vh,28px);padding:clamp(18px,3.4vh,40px) clamp(20px,3vw,56px) clamp(34px,5vh,52px);text-align:center;background:radial-gradient(120% 90% at 50% 18%,#223764,#142649 58%,#0d1b38);border:3px solid #e8bf5a;border-radius:50% 50% 30px 30px/24% 24% 30px 30px;box-shadow:inset 0 0 0 6px #132447,inset 0 0 0 8.5px #c9973a,0 16px 34px rgba(0,0,0,.55)}
.rl-crest-brand{display:flex;align-items:center;justify-content:center;gap:.35em;font:700 clamp(28px,min(2.5vw,4.6vh),40px)/1.1 'Playfair Display',Georgia,serif;color:#f6cf63;text-shadow:0 2px 0 #4a2f08,0 3px 8px rgba(0,0,0,.5)}
.rl-laurel{flex:none;width:1.6em;height:.8em}
.rl-laurel.r{transform:scaleX(-1)}
.rl-crest-title{margin:.12em 0 0;font:800 clamp(56px,min(5.2vw,9.2vh),90px)/1.02 'Playfair Display',Georgia,serif;letter-spacing:.005em;color:#f6c955;background:linear-gradient(180deg,#fff6d2 0%,#ffe08a 36%,#f2bb45 66%,#c98a1f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.4px #3d2707;paint-order:stroke fill;filter:drop-shadow(0 4px 4px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,200,90,.25))}
.rl-ribbon-wrap{position:absolute;left:50%;bottom:0;transform:translate(-50%,52%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));white-space:nowrap}
.rl-ribbon{padding:.16em 1.5em .22em;background:linear-gradient(#fff8e2,#f3e0b2 55%,#e1c387);color:#14254a;font:700 clamp(28px,min(2.4vw,4.4vh),40px)/1.15 'Playfair Display',Georgia,serif;clip-path:polygon(0 0,100% 0,96.5% 50%,100% 100%,0 100%,3.5% 50%);border-top:2px solid #fffaf0;border-bottom:3px solid #b98d3c}
.rl-w-tag{margin:0;text-align:center;color:#fff;font:700 clamp(26px,min(2.1vw,4.2vh),36px)/1.2 Fredoka,Nunito,sans-serif;text-shadow:0 2px 4px rgba(0,0,0,.75),0 0 18px rgba(0,0,0,.55)}
.rl-start{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.45em;width:min(100%,640px);min-height:max(72px,9.6vh);padding:.12em 1.2em;border:3px solid #fff1b5;border-radius:999px;background:linear-gradient(180deg,#fff2a3 0%,#ffd64c 30%,#f6b71e 64%,#e2970b 100%);color:#13213f;font:700 clamp(36px,min(3.1vw,6vh),48px)/1 Fredoka,Nunito,sans-serif;box-shadow:0 0 0 2px #b77a10,0 6px 0 #a3680e,0 0 30px rgba(255,205,80,.6),inset 0 2px 0 #fffbe0;cursor:pointer;animation:rlStartGlow 2.4s ease-in-out infinite;transition:transform .12s,filter .12s}
.rl-start::before{content:'';position:absolute;left:6%;right:6%;top:5%;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.rl-start span{font-size:1.1em;line-height:.8}
.rl-start:hover,.rl-start:focus-visible{filter:brightness(1.06);transform:translateY(-2px);outline:none}
.rl-start:active{transform:scale(.98)}
.rl-start.rl-go{animation:trainShake .5s linear infinite}
@keyframes rlStartGlow{50%{box-shadow:0 0 0 2px #b77a10,0 6px 0 #a3680e,0 0 46px rgba(255,214,100,.9),inset 0 2px 0 #fffbe0}}
.rl-w-sub{display:flex;align-items:center;justify-content:center;gap:.6em;margin:0;color:#fff;font:italic 700 clamp(22px,min(1.7vw,3.4vh),28px)/1.2 Nunito,sans-serif;text-shadow:0 2px 4px rgba(0,0,0,.75),0 0 14px rgba(0,0,0,.5)}
.rl-w-sub::before,.rl-w-sub::after{content:'';flex:none;width:clamp(28px,3.6vw,64px);height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(242,193,78,0),#f2c14e)}
.rl-w-sub::after{transform:scaleX(-1)}
@media(max-width:760px){
 .rl-w-main{display:flex;flex-direction:column;align-items:stretch;gap:14px}
 .rl-w-right{display:contents}
 .rl-crest{order:1;align-self:center;padding:22px 16px 40px;border-radius:50% 50% 24px 24px/14% 14% 24px 24px}
 .rl-crest-brand{font-size:24px}
 .rl-crest-title{font-size:clamp(44px,12vw,56px)}
 .rl-ribbon{font-size:clamp(18px,5vw,24px);padding:.16em 1.1em .22em}
 .rl-ribbon-wrap{max-width:96vw}
 .rl-w-owl{order:2;justify-content:center;padding:0;min-height:0}
 .rl-w-owl .rl-owl{height:min(34vh,300px)}
 .rl-w-tag{order:3;font-size:24px}
 .rl-start{order:4;align-self:center;font-size:34px;min-height:72px}
 .rl-w-sub{order:5;font-size:20px}
}
/* ---------- Page 2: placement ---------- */
.rl-p-banner{position:relative;align-self:center;max-width:min(1120px,98%);margin:clamp(24px,2.8vh,32px) 0 clamp(20px,2.8vh,28px);padding:clamp(6px,1vh,12px) clamp(36px,4.6vw,90px) clamp(24px,3vh,32px);text-align:center;background:linear-gradient(#1f3869,#10234b);border:3px solid #e2b24c;border-radius:22px;box-shadow:inset 0 0 0 4px #10234b,inset 0 0 0 6px #b98a35,0 10px 24px rgba(0,0,0,.5)}
.rl-p-banner h1{display:flex;align-items:center;justify-content:center;gap:.4em;margin:0;color:#fff;font:700 clamp(36px,min(3vw,5.6vh),48px)/1.1 Fredoka,Nunito,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.rl-p-banner .rl-laurel{width:1.3em;height:.65em}
.rl-p-sub{position:absolute;left:50%;bottom:0;transform:translate(-50%,58%);white-space:nowrap;padding:.22em 1.4em .26em;background:linear-gradient(#fff8e2,#f1dcab 60%,#e2c487);color:#14254a;font:700 clamp(18px,min(1.45vw,2.8vh),24px)/1.15 Fredoka,Nunito,sans-serif;clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.rl-p-main{flex:1;min-height:0;width:min(100%,1780px);margin:0 auto;display:grid;grid-template-columns:minmax(230px,23%) minmax(0,1fr);gap:clamp(12px,1.4vw,24px)}
.rl-p-left{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:8px;min-height:0}
.rl-p-owl{flex:1 1 0;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.rl-p-owl .rl-owl{display:block;max-height:100%;max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.rl-p-info{margin-top:16px;padding:0 clamp(12px,1vw,18px) clamp(12px,1.6vh,18px);text-align:center;color:#1d2440;background:linear-gradient(#fffdf6,#f5ecd8);border:2px solid #e2cd96;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.rl-p-green{margin:-16px -8px 10px;padding:.32em .5em .38em;color:#fff;font:700 clamp(22px,1.5vw,26px)/1.12 Fredoka,Nunito,sans-serif;background:linear-gradient(#2f8a3a,#1c6a2a);border:2px solid #d9b45a;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.rl-p-info p{margin:0 0 10px;font:600 17px/1.35 Nunito,sans-serif}
.rl-p-pill{display:flex;align-items:center;justify-content:center;gap:.45em;min-height:40px;margin-top:6px;padding:4px 10px;border-radius:999px;background:#f3f6e8;border:2px solid #9cc38d;color:#1f3a22;font:800 16px/1.15 Nunito,sans-serif}
.rl-p-right{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);min-height:0}
.rl-cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1vw,18px)}
.rl-col{position:relative;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);min-height:0}
.rl-step{position:relative;display:flex;align-items:center;justify-content:center;gap:.45em;min-height:clamp(48px,6.2vh,60px);padding:4px 12px;border-radius:999px;background:linear-gradient(#fffdf7,var(--c1));border:2.5px solid var(--c);color:#0e1838;font:700 clamp(22px,1.55vw,26px)/1 Fredoka,Nunito,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
.rl-step.now{border-width:3.5px;box-shadow:0 0 18px var(--c),0 4px 12px rgba(0,0,0,.3)}
.rl-step-num{flex:none;display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;color:#fff;background:linear-gradient(var(--c2),var(--c));box-shadow:0 .08em .2em rgba(0,0,0,.3),inset 0 .1em 0 rgba(255,255,255,.35)}
.rl-step.done .rl-step-num{background:linear-gradient(#5cc22b,#2f8f10)}
.rl-col:not(:last-child) .rl-step::after{content:'›';position:absolute;right:calc(-1*clamp(10px,1vw,18px) + 1px);top:50%;transform:translate(50%,-55%);color:#3fae2c;font:900 28px/1 Nunito,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.rl-pcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,12px);padding:clamp(10px,1.4vh,16px) clamp(10px,1vw,16px);text-align:center;color:#1d2440;background:linear-gradient(#fffdf7 0%,var(--c1) 55%,var(--c3) 100%);border:3px solid var(--c);border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.rl-pcard .chip{font-size:16px;padding:.2em .8em}
.rl-pcard-say{flex:1;display:grid;place-items:center;margin:0;font:600 18px/1.35 Fredoka,Nunito,sans-serif}
.rl-pcard-say.small{flex:none}
.rl-gemgrid{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:center;font-size:20px}
.rl-gemgrid button{min-height:44px}
.rl-pbtn{flex:none;width:min(100%,300px);min-height:48px;padding:6px 14px;border-radius:999px;font:700 clamp(18px,1.25vw,21px)/1 Fredoka,Nunito,sans-serif;cursor:pointer;transition:filter .12s,transform .12s}
.rl-pbtn.gold{color:#211800;border:2px solid #b07a14;background:linear-gradient(#ffe783,#f6bd28 60%,#e99b0b);box-shadow:0 3px 0 #a86d12,0 0 14px rgba(255,200,70,.45)}
.rl-pbtn.ghost{color:#1c2948;border:2px solid #c9a24f;background:linear-gradient(#fffdf7,#efe5d0);box-shadow:0 2px 0 #b8954a}
.rl-pbtn:hover,.rl-pbtn:focus-visible{filter:brightness(1.06);transform:translateY(-1px);outline:none}
.rl-p-journey{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.3em .6em;min-height:54px;padding:6px 16px;border-radius:18px;color:#fff6dc;background:linear-gradient(#22396b,#11234a);border:3px solid #e2b24c;box-shadow:0 4px 12px rgba(0,0,0,.35);font:700 18px/1.2 Nunito,sans-serif}
.rl-p-journey b:first-of-type{font-family:Fredoka,Nunito,sans-serif;font-size:1.1em}
.rl-p-gems{display:inline-flex;gap:.12em;font-size:24px}
.rl-p-journey>img:first-child{width:28px!important;height:28px!important}
.rl-p-finish{display:flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:4px 16px;border-radius:999px;color:#3a3f52;background:#fbf6ea;border:2px solid #e2cd96;box-shadow:0 4px 12px rgba(0,0,0,.25);font:800 17px/1.2 Nunito,sans-serif;text-align:center}
.rl-p-finish img{width:24px!important;height:24px!important}
@media(max-width:760px){
 .rl-p-banner{width:100%;padding:8px 14px 12px}
 .rl-p-banner h1{font-size:36px}
 .rl-p-banner .rl-laurel{display:none}
 .rl-p-sub{position:static;transform:none;white-space:normal;margin-top:8px;font-size:18px}
 .rl-p-main{display:flex;flex-direction:column}
 .rl-p-owl .rl-owl{max-height:28vh}
 .rl-cards{display:flex;flex-direction:column;gap:16px}
 .rl-col:not(:last-child) .rl-step::after{display:none}
 .rl-pcard{min-height:220px}
 .rl-step{font-size:22px}
}
/* ---------- Page 3: journey map ---------- */
.scene.native-journey{background:#3c5a3a}
.journey-backdrop.rl-jbg{position:fixed;inset:0;width:100vw;height:100dvh;z-index:0;pointer-events:none;background:none}
.journey-backdrop.rl-jbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,35,67,.08),rgba(20,35,67,.12) 60%,rgba(20,35,67,.2))}
.journey-shell{gap:clamp(4px,.9vh,10px)}
.journey-shell .rl-topbar{margin:0}
.journey-heading{padding:6px 28px 8px}
.journey-grid{flex:1 1 auto;min-height:0;grid-template-rows:repeat(2,auto);align-content:space-evenly;row-gap:clamp(8px,1.6vh,22px);column-gap:clamp(10px,1vw,18px);padding:4px 0}
.journey-rail{display:block!important;position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.journey-station{position:relative;z-index:1;justify-content:flex-start;gap:4px}
.journey-crop.rl-stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:auto;height:auto;padding:0;border:0;background:none;box-shadow:none;cursor:pointer}
.rl-gem{position:relative;display:block;width:clamp(64px,min(5vw,9.2vh),80px);aspect-ratio:112/98}
.rl-gem-glow{position:absolute;left:50%;top:82%;width:160%;height:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--glow),rgba(255,255,255,0));opacity:.75;pointer-events:none}
.rl-gem-svg{position:relative;display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.rl-gem.is-current .rl-gem-glow{animation:rlGlow 2.2s ease-in-out infinite}
.rl-gem.is-current .rl-gem-svg{animation:rlBob 2.2s ease-in-out infinite}
@keyframes rlGlow{50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes rlBob{50%{transform:scale(1.07)}}
.rl-gem.is-locked .rl-gem-svg{opacity:.72}
.rl-gem-num{position:absolute;left:-8px;top:-4px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#d9a441;border:2px solid #fff1c4;color:#17294d;font:900 15px/1 Nunito,sans-serif;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.rl-gem-lock{position:absolute;right:-8px;top:-4px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#22396b;border:2px solid #fff1c4}
.rl-plaque{max-width:min(100%,240px);padding:3px 12px 4px;border-radius:10px;background:#17294d;border:2px solid #e0b44f;color:#fff5da;font:700 17px/1.15 Fredoka,Nunito,sans-serif;text-align:center;white-space:normal;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.journey-card{min-height:0;gap:6px;padding:10px 14px 12px}
.journey-gem-name{font-size:clamp(20px,1.45vw,22px)}
.journey-badge{font-size:14px}
.journey-metric{font-size:17px;grid-template-columns:84px minmax(20px,1fr) 46px}
.journey-action{min-height:44px;font-size:17px;margin-top:4px}
.journey-progress .progress-stat{font-size:17px}
.journey-progress h2{font-size:24px}
.journey-progress-inner{font-size:17px}
.rl-train{position:absolute;left:0;top:0;width:64px;height:44px;z-index:2;transform-origin:0 0;pointer-events:none;will-change:transform}
.rl-train svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.rl-puff{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;z-index:3;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.75) 42%,rgba(255,255,255,0) 70%);animation:rlPuff 1.15s ease-out forwards}
@keyframes rlPuff{from{opacity:.9;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx,6px),-48px) scale(2.5)}}
.rl-spark{position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;z-index:4;pointer-events:none;background:#fff6c4;box-shadow:0 0 10px #ffd86a;animation:rlSpark .75s ease-out forwards}
@keyframes rlSpark{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.4)}}
.journey-station.rl-pre .journey-card{opacity:.72}
.journey-station.rl-pop .journey-card{animation:rlCardPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rlCardPop{40%{transform:scale(1.06)}}
.journey-station.rl-arrive .rl-gem-svg{animation:rlArrive .45s ease-in-out 3}
@keyframes rlArrive{50%{transform:scale(1.28)}}
@media(min-width:901px) and (max-height:820px){.journey-heading{padding:4px 22px 6px}.journey-heading h1{font-size:30px}.journey-heading p{font-size:16px}.journey-card{padding:8px 12px 10px;gap:4px}}
@media(max-width:900px){
 .journey-grid{gap:76px;padding-top:56px}
 .journey-card{min-height:0}
}
/* ---------- Page transitions ---------- */
#rl-fx{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.rl-steam-puff{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.97),rgba(250,252,255,.88) 45%,rgba(240,244,250,.5) 72%,rgba(255,255,255,0));will-change:transform}
.rl-fx-train{position:absolute;left:0;bottom:16vh;height:30vh;width:auto;will-change:transform}
.rl-enter-place .rl-p-banner{animation:rlDrop .42s cubic-bezier(.2,.9,.3,1.15) .16s backwards}
.rl-enter-place .rl-p-left,.rl-enter-place .rl-col,.rl-enter-place .rl-p-journey,.rl-enter-place .rl-p-finish{animation:rlRise .38s ease-out backwards;animation-delay:calc(.26s + var(--i,0)*60ms)}
.rl-enter-rail .rl-gem{animation:rlPopIn .38s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(.28s + var(--i,0)*50ms)}
@keyframes rlDrop{from{opacity:0;transform:translateY(-34px)}}
@keyframes rlRise{from{opacity:0;transform:translateY(26px)}}
@keyframes rlPopIn{from{opacity:0;transform:scale(.3)}}
@keyframes rlDraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){

/* ---------- writing tasks: each genre has its own kind of writing; length grows with the level ---------- */
const TASKS={
 'Informational Passage':{name:'Explain the main idea',focus:'Main idea • Supporting details',labels:['Main idea','Detail','Detail','Wrap-up'],icons:['💡','🔎','🔎','🏁'],starters:['The main idea is','One important detail is','Another detail is','This shows that'],ask:'Explain the main idea of the text and support it with details from it.',checks:['I stated the main idea.','I used details from the text.','I wrote complete sentences.','I checked capitals and punctuation.'],tip:'Say the big idea first, then prove it.'},
 'Science & Nonfiction':{name:'Explain how or why',focus:'Cause and effect • Examples',labels:['Topic','How / why','Example','Conclusion'],icons:['🔬','⚙️','🔎','🏁'],starters:['This text explains','This happens because','For example,','Therefore,'],ask:'Explain how or why something in the text happens. Use an example from the text.',checks:['I named the topic.','I explained how or why.','I gave an example from the text.','I checked capitals and punctuation.'],tip:'Use "because" to show the reason.'},
 'Fable':{name:'Retell and find the lesson',focus:'Sequence • Moral of the story',labels:['First','Next','Then','Lesson'],icons:['📅','🔎','📍','⭐'],starters:['First,','Next,','Then,','The lesson is'],ask:'Retell the fable in order, then explain the lesson it teaches.',checks:['Events are in order.','I explained the lesson.','I wrote complete sentences.','I checked capitals and punctuation.'],tip:'Tell the events in order, then share the lesson.'},
 'Fiction':{name:'Retell the story',focus:'Beginning, middle, and ending',labels:['First','Next','Then','Finally'],icons:['📅','🔎','📍','🏁'],starters:['First,','Next,','Then,','Finally,'],ask:'Retell what happened in the story. Use First, Next, Then, and Finally.',checks:['Events are in order.','I used sequence words.','I wrote complete sentences.','I checked capitals and punctuation.'],tip:'Use your own words. Tell the events in order.'},
 'Short Story':{name:'Retell the story',focus:'Beginning, middle, and ending',labels:['First','Next','Then','Finally'],icons:['📅','🔎','📍','🏁'],starters:['First,','Next,','Then,','Finally,'],ask:'Retell the story in your own words. Use First, Next, Then, and Finally.',checks:['Events are in order.','I used sequence words.','I wrote complete sentences.','I checked capitals and punctuation.'],tip:'Use your own words. Tell the events in order.'},
 'Novel':{name:'Describe a character',focus:'Character traits • Text evidence',labels:['Character','Trait','Evidence','Why it matters'],icons:['🧑','💬','🔎','⭐'],starters:['The character I chose is','This character is','I know this because','This matters because'],ask:'Describe one character. Name a trait and prove it with evidence from the text.',checks:['I named a character.','I described a trait.','I used evidence from the text.','I checked capitals and punctuation.'],tip:'Prove your idea with words from the text.'},
 'Bible Scripture':{name:'Reflect on the message',focus:'Message • Personal connection',labels:['Message','Meaning','In my life','Closing'],icons:['📜','💡','🌱','🏁'],starters:['This passage teaches','It means that','In my life,','I will remember'],ask:'Explain the message of the passage and connect it to your own life.',checks:['I explained the message.','I made a personal connection.','I wrote complete sentences.','I checked capitals and punctuation.'],tip:'Connect the message to your own life.'},
 'Essay':{name:'Share your opinion',focus:'Claim • Reasons • Evidence',labels:['Claim','Reason','Evidence','Conclusion'],icons:['📣','💡','🔎','🏁'],starters:['I believe','One reason is','For example,','In conclusion,'],ask:'Do you agree with the writer? State your claim and support it with reasons.',checks:['I stated a clear claim.','I gave reasons.','I used an example.','I checked capitals and punctuation.'],tip:'State your claim clearly, then give reasons.'},
 'News Report':{name:'Summarize the news',focus:'5 Ws • Importance',labels:['Who & what','When & where','Why','So what'],icons:['📰','🕒','❓','⭐'],starters:['This report is about','It happened','This happened because','This matters because'],ask:'Summarize the report: who, what, when, where, and why it matters.',checks:['I told who and what.','I told when and where.','I explained why it matters.','I checked capitals and punctuation.'],tip:'Answer who, what, when, where, and why.'},
 'Poetry':{name:'Respond to the poem',focus:'Imagery • Feeling • Message',labels:['Image','Feeling','Word choice','Message'],icons:['🖼️','💗','🔤','⭐'],starters:['The poem shows','It makes me feel','The poet uses the words','The message is'],ask:'Describe an image from the poem, how it makes you feel, and its message.',checks:['I described an image.','I shared a feeling.','I quoted the poet\'s words.','I checked capitals and punctuation.'],tip:'Notice the pictures the words make.'}};

/* ---------- placement assessment (painted card: "A Morning at the Station") ---------- */
const PLACE={title:'A Morning at the Station',paragraphs:['Mia arrived early at the old train station. The glass roof sparkled in the morning sun, and pigeons hopped between the benches. She held her ticket tightly in one hand and her grandmother\'s hand in the other.','At exactly seven o\'clock, a long whistle echoed through the hall. The train pulled into the station, puffing clouds of white steam. A friendly conductor stepped down and called, "All aboard for Riverside!"','Mia checked her ticket one more time: Seat 12, Car B. She took a deep breath, smiled at her grandmother, and climbed the steps. Her first long journey had finally begun.'],
 questions:[['Who came to the station with Mia?',['Her brother','Her grandmother','The conductor','Her teacher'],1],['When did the train arrive?',['At noon','At exactly seven o\'clock','In the evening','At midnight'],1],['What did Mia do just before she boarded?',['She bought a snack','She checked her ticket one more time','She fed the pigeons','She called a friend'],1],['How did Mia most likely feel?',['Bored','Angry','Excited and a little nervous','Sleepy'],2],['What is the passage mainly about?',['How trains are built','Mia starting her first long journey','A lost ticket','Pigeons at the station'],1],['Word meaning: "echoed" means…',['sounded again and again','stopped quickly','stayed very quiet','moved fast'],0],['Word meaning: a "conductor" is…',['a person who helps passengers on a train','a kind of ticket','the train\'s engine','a long bench'],0],['Word meaning: a "journey" is…',['a trip from one place to another','a short nap','a train whistle','a glass roof'],0]]};

const STORE='sra-rw-journey-v1',OLD='sra-reading-express-offline-v2';

const tid=(c,n)=>`${KEY(c)}-${n}`;

/* Shared My Progress overlay (single instance, no duplicate IDs/listeners). */
let _progEscBound=false,_progDrag=null,_progSuppressClick=0;function _progEscHandler(e){if(e.key!=='Escape')return;const d=document.getElementById('rl-progress-drawer');if(d&&d.getAttribute('aria-hidden')==='false'){e.preventDefault();setProgressOpen(false)}}
function clearProgressOverlay(){
 try{
  ['rl-progress-toggle','rl-progress-backdrop','rl-progress-drawer'].forEach(id=>document.getElementById(id)?.remove());
  if(_progEscBound){document.removeEventListener('keydown',_progEscHandler);_progEscBound=false;}
  _progDrag=null;
 }catch(e){console.error('clearProgressOverlay failed',e)}
}
function progressBodyHTML(){
 const rd=sum(lvRead),wr=sum(lvWrite),completed=sum(lvDone),cu=current(),st=cu.all?'done':stage(cu.c,cu.n),b=book(cu.c,cu.n),step={read:'Read',quiz:'Questions',write:'Write',done:'Done'}[st],earned=[0,1,2,3,4,5].filter(c=>lvDone(c)===10).length;
 const stat=(label,value,total,color='')=>`<div class="progress-stat"><b>${label}</b><b>${value}/${total}</b><div class="progress-bar"><i style="width:${Math.min(100,value/total*100)}%;${color?'background:'+color:''}"></i></div></div>`;
 return `<section aria-label="Reading and writing totals">${stat('Reading',rd,60)}${stat('Writing',wr,60,'linear-gradient(90deg,#65a8ff,#2860d5)')}${stat('Completed texts',completed,60)}</section><h3>Current task</h3><section class="progress-task"><b>${esc(LV[cu.c].name)} · Text ${cu.n}</b><div>${esc(b?.title||'Journey complete')}</div><div class="progress-step">Step: ${step}</div><button type="button" class="journey-action" id="journey-progress-continue">${cu.all?'View certificates':'Continue'}</button></section><h3>Ollie’s tip</h3><div class="rl-tip"><img class="rl-tip-owl" src="${ART}owl.png" alt="Ollie the owl" draggable="false"><p class="rl-tip-bubble">${st==='read'?'Read carefully and take your time.':st==='quiz'?'Use what you remember from the passage to answer each question.':st==='write'?'Use your own words and check that every sentence supports your ideas.':'Great work—finish the next open text when you are ready.'}</p></div><h3>Certificate goal</h3><section class="progress-task"><b>${lvDone(5)===10?'Diamond certificate earned':'Complete Diamond 10'}</b><div style="margin-top:5px">${earned}/6 level certificates earned · ${lvDone(5)}/10 Diamond texts complete</div></section>`;
}
function _progIsOpen(){const d=document.getElementById('rl-progress-drawer');return !!(d&&d.getAttribute('aria-hidden')==='false')}
function setProgressOpen(open){
 const dr=document.getElementById('rl-progress-drawer'),back=document.getElementById('rl-progress-backdrop'),tab=document.getElementById('rl-progress-toggle');
 if(!dr||!back||!tab)return;
 const wasOpen=dr.getAttribute('aria-hidden')==='false',o=!!open;
 dr.style.transform=o?'translateX(0)':'translateX(100%)';dr.style.visibility=o?'visible':'hidden';dr.style.pointerEvents=o?'auto':'none';
 dr.style.transition=o?'transform .25s cubic-bezier(.2,.85,.25,1),visibility 0s linear 0s':'transform .25s cubic-bezier(.2,.85,.25,1),visibility 0s linear .25s';
 dr.setAttribute('aria-hidden',o?'false':'true');
 back.style.opacity=o?'1':'0';back.style.visibility=o?'visible':'hidden';back.style.pointerEvents=o?'auto':'none';
 back.style.transition=o?'opacity .16s ease,visibility 0s linear 0s':'opacity .16s ease,visibility 0s linear .16s';
 tab.setAttribute('aria-expanded',o?'true':'false');tab.setAttribute('aria-label',o?'Close My Progress':'Open My Progress');
 const arr=tab.querySelector('.prog-arrow');if(arr)arr.style.transform=o?'rotate(180deg)':'';
 if(o)dr.querySelector('.prog-close')?.focus?.({preventScroll:true});
 else if(wasOpen&&document.activeElement&&dr.contains(document.activeElement))tab.focus?.({preventScroll:true});
}
function openProgress(){
 if(S.scene!=='journey')return;
 if(!document.getElementById('rl-progress-drawer'))mountProgressOverlay({title:'My Progress',bodyHTML:progressBodyHTML()});
 setProgressOpen(true);
}
function _progBindDrag(node,{openOnLeft=false,closeOnRight=false}={}){
 node.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest?.('.prog-close'))return;
  _progDrag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,fired:false,openOnLeft,closeOnRight};
  try{node.setPointerCapture(e.pointerId)}catch(_){ }
 });
 node.addEventListener('pointermove',e=>{
  const d=_progDrag;if(!d||d.id!==e.pointerId||d.fired)return;
  const dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.25)d.moved=true;
  if(!d.moved)return;
  if(d.openOnLeft&&dx<-24&&!_progIsOpen()){d.fired=true;setProgressOpen(true)}
  if(d.closeOnRight&&dx>24&&_progIsOpen()){d.fired=true;setProgressOpen(false)}
 });
 const end=e=>{
  const d=_progDrag;if(!d||d.id!==e.pointerId)return;
  if(d.moved||d.fired)_progSuppressClick=Date.now()+400;
  try{node.releasePointerCapture(e.pointerId)}catch(_){ }
  _progDrag=null;
 };
 node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end);
}
function mountProgressOverlay({title='My Progress',bodyHTML='',toggleLabel='My Progress',toggleStyle='',drawerStyle=''}={}){
 clearProgressOverlay();
 const back=document.createElement('button');back.type='button';back.id='rl-progress-backdrop';back.setAttribute('aria-label','Close My Progress');
 back.style.cssText='position:fixed;inset:0;background:rgba(20,12,30,.38);border:0;padding:0;margin:0;z-index:79;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility 0s linear .16s;';
 const dr=document.createElement('aside');dr.id='rl-progress-drawer';dr.setAttribute('aria-hidden','true');
 dr.style.cssText=drawerStyle||'position:fixed;top:var(--toolbar-h);right:0;bottom:0;width:min(420px,94vw);z-index:80;overflow:auto;touch-action:pan-y;background:linear-gradient(rgba(255,253,247,.97),rgba(248,238,214,.95));border-left:2px solid rgba(217,164,65,.45);box-shadow:-10px 0 30px rgba(0,0,0,.22);transform:translateX(100%);visibility:hidden;pointer-events:none;transition:transform .26s cubic-bezier(.2,.85,.25,1),visibility 0s linear .26s;';
 dr.innerHTML='<div class="journey-progress-inner"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2>'+esc(title)+'</h2><button type="button" class="prog-close" aria-label="Close My Progress">×</button></div>'+bodyHTML+'</div>';
 const tab=document.createElement('button');tab.type='button';tab.id='rl-progress-toggle';tab.className='hit';tab.setAttribute('aria-expanded','false');tab.setAttribute('aria-controls','rl-progress-drawer');tab.setAttribute('aria-label','Open My Progress');
 tab.style.cssText=toggleStyle||'position:fixed;right:0;top:22vh;z-index:81;width:28px;height:108px;padding:0;border:1px solid #e2b24c;border-right:0;border-radius:12px 0 0 12px;background:rgba(20,35,67,.82);color:#fff6dc;box-shadow:-4px 0 14px rgba(0,0,0,.22);cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center';
 tab.innerHTML='<span style="display:flex;flex-direction:column;align-items:center;gap:.45em"><span class="prog-arrow" style="display:inline-block;font-size:1.1em;transition:transform .22s">‹</span><b style="writing-mode:vertical-rl;transform:rotate(180deg);font:700 12px/1 Fredoka,Nunito,sans-serif;letter-spacing:.05em">'+esc(toggleLabel)+'</b></span>';
 tab.onclick=e=>{e.stopPropagation();if(Date.now()<_progSuppressClick)return;try{ac();SFX.pop()}catch(_){ }setProgressOpen(!_progIsOpen())};
 back.onclick=()=>setProgressOpen(false);
 dr.querySelector('.prog-close')?.addEventListener('click',()=>setProgressOpen(false));
 _progBindDrag(tab,{openOnLeft:true,closeOnRight:true});
 _progBindDrag(dr,{closeOnRight:true});
 dr.addEventListener('focusout',()=>setTimeout(()=>{if(_progIsOpen()&&!dr.contains(document.activeElement))setProgressOpen(false)},0));
 if(!_progEscBound){document.addEventListener('keydown',_progEscHandler);_progEscBound=true;}
 document.body.append(back,dr,tab);
 setProgressOpen(false);
}
