<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>READwy Reading Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070e16;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:#1d2440;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
:root{--toolbar-h:0px;--toolbar-h-art:0px}
#world{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;background:#070e16}
.scene::before{content:"";position:absolute;inset:-3%;background-image:var(--scene-bg);background-size:cover;background-position:center;filter:blur(22px) brightness(.42) saturate(.8);transform:scale(1.04);pointer-events:none}
.scene.leave{animation:sceneOut .32s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none;z-index:2}
.scene.enter{animation:sceneIn .42s cubic-bezier(.2,.9,.3,1.03) both}
@keyframes sceneOut{to{opacity:0;transform:scale(1.04);filter:brightness(1.3)}}
@keyframes sceneIn{from{opacity:0;transform:scale(.97)}}
.plate{position:absolute;overflow:hidden}
.plate>.art{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
/* Native journey page: one scenery layer, then independent HTML stations and controls. */
.scene.native-journey{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:#101a31}
.scene.native-journey::-webkit-scrollbar{display:none}
.scene.native-journey::before{inset:0;background-size:cover;filter:blur(9px) brightness(.38) saturate(.7);transform:scale(1.04)}
.scene.native-journey::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(135deg,rgba(10,20,42,.34),rgba(16,28,54,.48))}
.scene.native-journey .plate{position:relative;z-index:1;overflow:visible;min-height:100dvh}
.scene.native-journey .plate>.art{display:none}
.scene.safe-fit{background:linear-gradient(180deg,#1b2a4c 0%,#3c3654 45%,#5d4b63 100%)}
.scene.safe-fit::before{display:none!important}
.scene.safe-fit .plate{z-index:1}
.safe-extension{position:absolute;z-index:0;overflow:hidden;pointer-events:none;background-repeat:no-repeat;}
.journey-shell{width:100%;min-height:100dvh;padding:10px clamp(12px,2vw,32px) 18px;display:flex;flex-direction:column;gap:10px;color:#f7f2e3}
.journey-topbar{position:relative;min-height:52px;display:flex;align-items:center;gap:clamp(10px,2vw,26px);padding:7px 14px;border:1px solid #d9a441aa;border-radius:16px;background:rgba(20,35,67,.99);box-shadow:0 5px 18px #0005}
.journey-brand{color:#f1d58a;font:700 clamp(15px,1.5vw,21px)/1.1 Fredoka,Nunito,sans-serif;white-space:nowrap}
.journey-nav{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.8vw,12px);flex:1;min-width:0}
.journey-nav button,.journey-self,.journey-progress button{font:700 14px/1.1 Nunito,sans-serif}
.journey-nav button{min-height:34px;padding:6px 12px;border:1px solid transparent;border-radius:999px;color:#f5e8be;background:transparent;transition:background .1s,color .1s,transform .1s;white-space:nowrap}
.journey-nav button:hover,.journey-nav button:focus-visible{background:#d9a441;color:#15213e;transform:translateY(-1px)}
.journey-self{padding:8px 13px;border-radius:999px;color:#183050;background:#e6efce;border:1px solid #fff6dc;white-space:nowrap}
.journey-heading{text-align:center;align-self:center;max-width:min(900px,96vw);padding:9px 26px 10px;border:2px solid #d9a441;border-radius:24px;background:linear-gradient(135deg,rgba(20,35,67,.97),rgba(29,48,85,.96));box-shadow:0 7px 20px #0006}
.journey-heading h1{margin:0;color:#fff8e5;font:700 clamp(22px,2.35vw,34px)/1.05 Fredoka,Nunito,sans-serif}
.journey-heading p{margin:4px 0 0;color:#f1d58a;font:700 clamp(12px,1.2vw,17px)/1.2 Nunito,sans-serif}
.journey-grid{position:relative;isolation:isolate;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(9px,1.25vw,18px);padding:4px 1px}
.journey-rail{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible}
.journey-station{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.journey-crop{position:relative;width:clamp(112px,21vh,213px);max-width:100%;height:clamp(75px,14vh,142px);aspect-ratio:1.5;flex:none;overflow:hidden;border:2px solid #e6c36a;border-radius:18px;background-color:#142345;box-shadow:0 8px 20px #0007;background-repeat:no-repeat}
.journey-crop:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(10,20,40,.72));pointer-events:none}
.journey-train{filter:drop-shadow(0 2px 3px #0009)}
.journey-train svg{display:block;width:100%;height:100%}
.journey-card{width:min(100%,430px);min-height:160px;flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding:clamp(7px,.8vw,12px) clamp(9px,1vw,15px);border:2px solid var(--station-color);border-radius:17px;color:#17223d;background:linear-gradient(150deg,#fffdf7,#f4eddd);box-shadow:0 7px 18px #0005;font-size:clamp(12px,1vw,16px)}
.journey-card-head{display:flex;align-items:center;justify-content:space-between;gap:7px}
.journey-gem-name{font:700 clamp(16px,1.35vw,21px)/1.1 Fredoka,Nunito,sans-serif;color:#17223d}
.journey-badge{flex:none;padding:4px 8px;border-radius:999px;background:#e8edf6;color:#24365c;font-size:.76em;font-weight:900;white-space:nowrap}
.journey-metric{display:grid;grid-template-columns:68px minmax(20px,1fr) 34px;align-items:center;gap:7px;font-weight:800}
.journey-meter{height:8px;overflow:hidden;border-radius:999px;background:#d9dee8;box-shadow:inset 0 1px 2px #0002}
.journey-meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#64c43b,#268a21)}
.journey-meter.blue i{background:linear-gradient(90deg,#64a7ff,#2860d5)}
.journey-action{width:100%;min-height:34px;margin-top:auto;border:1px solid #c69436;border-radius:999px;background:linear-gradient(#ffe783,#f6bd28 60%,#e99b0b);color:#211800;font:700 14px/1 Nunito,sans-serif;box-shadow:0 2px 0 #a86d12;transition:filter .1s,transform .1s;cursor:pointer}
.journey-action:hover:not(:disabled),.journey-action:focus-visible{filter:brightness(1.07);transform:translateY(-1px)}
.journey-action:active:not(:disabled){transform:scale(.98)}
.journey-action.secondary{background:linear-gradient(#fffdf7,#eee5d3);color:#1c2948}
.journey-action:disabled{color:#635c50;background:#ddd8ce;border-color:#c6beb1;box-shadow:none;cursor:not-allowed}
.journey-progress-tab{position:fixed!important;right:0!important;top:38vh!important;z-index:91!important;width:31px!important;height:118px!important;padding:0!important;border:1px solid #e2b24c!important;border-right:0!important;border-radius:12px 0 0 12px!important;background:rgba(20,35,67,.96)!important;color:#fff6dc!important;box-shadow:-4px 0 14px #0005!important;touch-action:none!important;cursor:grab!important}
.journey-progress{color:#1d2440!important;background:linear-gradient(150deg,#fffdf7,#eee4cf)!important;border:1px solid #d9a441!important;border-radius:20px 0 0 20px!important;box-shadow:-12px 0 34px #0008!important}
.journey-progress-inner{padding:clamp(16px,3vw,28px);font:600 15px/1.35 Nunito,sans-serif}
.journey-progress h2{margin:0;font:700 27px/1 Fredoka,Nunito,sans-serif;color:#14254a}
.journey-progress h3{margin:18px 0 8px;font:700 17px/1.1 Fredoka,Nunito,sans-serif;color:#14254a}
.journey-progress .progress-stat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0}
.journey-progress .progress-bar{grid-column:1/-1;height:9px;background:#dfe3ea;border-radius:99px;overflow:hidden}
.journey-progress .progress-bar i{display:block;height:100%;background:linear-gradient(90deg,#73ce44,#2f8f10)}
.journey-progress .progress-task{padding:12px;border-radius:14px;background:#e6eefc;border:1px solid #b9ccec}
.journey-progress .prog-close{display:grid;place-items:center;flex:none;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:#22396b;color:#fff6dc;font:700 28px/1 sans-serif;cursor:pointer}
.scene.native-journey #caption{position:relative;left:auto;top:auto;bottom:auto;transform:none;z-index:30;max-width:min(820px,90vw);margin:0 auto;cursor:pointer;pointer-events:auto;font-size:clamp(12px,1.3vh,16px);padding:5px 12px}
@media(max-width:900px){
 .scene.native-journey{overflow-y:auto}
 .journey-shell{min-height:100dvh;padding:8px 10px 24px;gap:8px}
 .journey-topbar{min-height:unset;flex-wrap:wrap;gap:5px;padding:8px}
 .journey-brand{width:100%;text-align:center;font-size:17px}
 .journey-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));order:2;width:100%;justify-content:stretch;overflow:visible;padding-bottom:0}
 .journey-nav button{font-size:12px;padding:7px 5px;white-space:normal}
 .journey-self{position:static;order:1;margin:0 auto 0 0;font-size:11px}
 .journey-heading{padding:7px 16px;width:100%}
 .journey-heading h1{font-size:23px}
 .journey-heading p{font-size:12px}
 .journey-grid{display:flex;flex-direction:column;gap:12px;flex:none;padding:0 0 8px}
 .journey-rail{display:none}
 .journey-station{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;min-height:0}
 .journey-crop{width:min(100%,240px);height:auto;max-height:150px;min-height:0;aspect-ratio:1.5;align-self:center;border-radius:14px}
 .journey-card{width:min(calc(100vw - 40px),430px);max-width:100%;min-width:0;min-height:124px;padding:8px 9px;gap:4px;border-radius:14px;font-size:12px}
 .journey-card-head{gap:3px}
 .journey-gem-name{font-size:14px}
 .journey-badge{font-size:9px;padding:3px 5px}
 .journey-metric{grid-template-columns:58px minmax(14px,1fr) 30px;gap:5px;font-size:11px}
 .journey-action{min-height:29px;font-size:12px}
 .scene.native-journey #caption{left:auto;right:auto;top:auto;bottom:auto;max-width:none;width:100%}
}
@media(min-width:901px) and (max-height:820px){.journey-crop{width:clamp(114px,18vh,158px);height:clamp(76px,12vh,105px)}.journey-card{min-height:148px}}
@media(max-width:420px){.journey-self{padding:6px 8px}}
/* Background extensions retained for old scene markup; the current viewport underlay uses a blurred copy. */
.ext{position:absolute;background-repeat:no-repeat;pointer-events:none}
.ext::after{content:"";position:absolute;inset:0}

.ext.l::after{background:linear-gradient(90deg,rgba(20,12,24,.18),rgba(20,12,24,0))}
.ext.r::after{background:linear-gradient(90deg,rgba(20,12,24,0),rgba(20,12,24,.18))}
.ext.t::after{background:linear-gradient(180deg,rgba(20,12,24,.18),rgba(20,12,24,0))}
.ext.b::after{background:linear-gradient(180deg,rgba(20,12,24,0),rgba(20,12,24,.18))}
.abs{position:absolute}
.clone{position:absolute;background-repeat:no-repeat;pointer-events:none}
.feather{-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-composite:intersect}
/* live content painted over the cards (1 art pixel = var(--k)) */
.box{position:absolute;overflow:hidden;line-height:1.25}
.cream{background:radial-gradient(ellipse at 50% 50%,#fdfaf3,#fbf6ea 70%,#f9f2e2);border-radius:.6em}
.hit{position:absolute;border:0;padding:0;background:transparent;border-radius:.6em;transition:transform .18s,filter .18s,box-shadow .2s;z-index:3}
.hit:hover{filter:brightness(1.1);box-shadow:0 0 0 calc(3*var(--k)) #ffe27a99,0 0 calc(24*var(--k)) #ffd34d88}
.hit:active{transform:scale(.97)}
.hit:focus-visible,.pill:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid #ffb700;outline-offset:2px}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;gap:.35em;border-radius:999px;font-family:Fredoka,Nunito,sans-serif;font-weight:600;white-space:nowrap;border:0;padding:0 .8em;z-index:3;transition:transform .15s,filter .15s}
.pill:hover{transform:translateY(-1px) scale(1.03);filter:brightness(1.07)}
.tbbtn{color:transparent;background:transparent;transition:filter .18s,outline-color .18s}.tbbtn:hover,.tbbtn:focus-visible{background:transparent;color:transparent;filter:none;box-shadow:none}.tbbtn:focus-visible{outline:3px solid #ffb700;outline-offset:-3px}
.tbbtn:hover [fill='#f6ecd4'],.tbbtn:focus-visible [fill='#f6ecd4']{fill:#1d1400}.tbbtn:hover [stroke='#f6ecd4']{stroke:#1d1400}
/* painted toolbar buttons on the other pages also glow yellow under the pointer */
.hit.nav:hover{background:rgba(255,214,71,.5);mix-blend-mode:screen;box-shadow:0 0 calc(14*var(--k)) #ffd447}
.gold{background:linear-gradient(#ffe27a,#fbc531 55%,#f2a50c);color:#241600;box-shadow:inset 0 .12em 0 #fff8,0 .14em 0 #b06d00,0 .3em .6em #0004;border:.08em solid #fff0b8}
.goldtxt{background:linear-gradient(#fed65a,#fcc631 55%,#f9b81f);color:#1c1300;font-family:Fredoka,sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;gap:.3em;border-radius:999px;pointer-events:none}
.ghost{background:linear-gradient(#fffaf0,#f6ebd2);color:#1d2440;border:.08em solid #d9b46a;box-shadow:0 .12em 0 #c49a52}
.navy{background:linear-gradient(#22396b,#11234a);color:#fff;border:.08em solid #e2b24c}
.green{background:linear-gradient(#3b8f1c,#256d0b);color:#fff}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.08em .6em;border-radius:999px;font-weight:800;white-space:nowrap}
.cg{background:#e6f0cc;color:#1f4d0f}.cb{background:#dce8ff;color:#173c8a}.cl{background:#ece7dc;color:#5a5348}.cy{background:#fff1c2;color:#6b4a00}
.bar{position:relative;height:.6em;border-radius:99px;background:#dfe3ea;overflow:hidden;box-shadow:inset 0 .06em .15em #0002}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(#5cc22b,#2f8f10);transition:width 1s cubic-bezier(.3,.9,.3,1)}
.bar.blue>i{background:linear-gradient(#3d8bff,#1557d6)}
.gem{display:inline-block;width:1em;height:1em;flex:none;clip-path:polygon(50% 100%,0 38%,18% 8%,82% 8%,100% 38%);background:var(--g);box-shadow:inset 0 0 .3em #fff8;position:relative}
.ttl{font-family:Fredoka,Nunito,sans-serif;font-weight:700;color:#0e1838;line-height:1.05}
.muted{color:#5b5f6e}.ital{font-style:italic}
.card{position:absolute;border-radius:.7em;background:linear-gradient(#fffdf7,#fbf4e4);border:.1em solid #e0c88f;box-shadow:0 .15em .4em #6b4a1c33;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;overflow:hidden;text-align:center;padding:0;cursor:pointer;z-index:3}
.card:hover{transform:translateY(-4%) scale(1.04);box-shadow:0 .6em 1.2em #6b4a1c55,0 0 0 .12em #ffd34d}
.card.locked{cursor:not-allowed}.card.locked:hover{transform:rotate(-1deg)}.card.locked .num{background:#555!important}
.card.now{border-color:#2f8f10;box-shadow:0 0 0 .1em #2f8f10,0 0 1em #7ee08188;animation:breatheCard 2.4s ease-in-out infinite}
@keyframes breatheCard{50%{box-shadow:0 0 0 .14em #2f8f10,0 0 1.6em #7ee081}}
.thumb{position:relative;display:grid;place-items:center;overflow:hidden}
.thumb b{font-size:2.4em;display:inline-flex;filter:drop-shadow(0 .08em .1em #0005)}
/* swipe from right to left (next) or left to right (back) for passage pages and questions */
.swR{animation:swR .42s cubic-bezier(.2,.8,.25,1) both}.swL{animation:swL .42s cubic-bezier(.2,.8,.25,1) both}
@keyframes swR{from{transform:translateX(18%);opacity:0}}@keyframes swL{from{transform:translateX(-18%);opacity:0}}
@keyframes floaty{50%{transform:translateY(-6%) rotate(-3deg)}}
.num{position:absolute;left:.3em;top:.3em;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-family:Fredoka;font-weight:700;color:#fff;background:#2f7d14;border:.1em solid #fff;box-shadow:0 .1em .2em #0005}
.lockb{position:absolute;right:.3em;top:.3em;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:#2b2b33cc;font-size:.85em}
/* owls, steam, glow, sparkles */
/* owls: blink and jump in place (no breathing, no talking motion) */
.gemcut{transform-origin:50% 60%;animation:gemPulse 2.6s ease-in-out infinite;transition:transform .3s}
@keyframes gemPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.1);filter:brightness(1.25) saturate(1.2)}}
.gemcut.hot{animation:gemHot .7s ease-in-out infinite}@keyframes gemHot{0%,100%{transform:scale(1.15);filter:brightness(1.3)}50%{transform:scale(1.25) rotate(0deg);filter:brightness(1.5) saturate(1.3)}}
.hit.stn:hover{box-shadow:none;filter:none}
.owlwrap{transform-origin:50% 100%;animation:hop 2.8s ease-in-out infinite;z-index:1}
.trainwrap{transform-origin:60% 100%;animation:engineRun .34s steps(2) infinite;z-index:1}
/* engine running: a steady rumble, as if the train has started and is about to leave */
.locorumble{transform-origin:50% 100%;animation:engineRun .34s steps(2) infinite}
@keyframes engineRun{0%{transform:translate(0,0)}25%{transform:translate(.06%,-.35%)}50%{transform:translate(-.05%,0)}75%{transform:translate(.04%,-.25%) rotate(.12deg)}100%{transform:translate(0,0)}}
@keyframes trainShake{0%,100%{transform:translate(0,0)}4%{transform:translate(.08%,-.12%) rotate(.12deg)}8%{transform:translate(-.08%,.06%)}12%{transform:translate(.06%,-.1%) rotate(-.1deg)}16%{transform:translate(0,0)}50%{transform:translate(0,0)}53%{transform:translate(.1%,-.16%) rotate(.15deg)}56%{transform:translate(-.1%,.08%) rotate(-.12deg)}59%{transform:translate(.08%,-.14%)}62%{transform:translate(-.06%,.06%)}65%{transform:translate(0,0)}}
#trainfx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#trainfx img{position:absolute;bottom:6vh;height:62vh;width:auto;filter:drop-shadow(0 2vh 2vh rgba(0,0,0,.45));will-change:transform}
#trainfx i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,rgba(250,248,255,.92) 45%,rgba(245,245,252,0) 70%);animation:trainPuff 1.4s ease-out forwards}
@keyframes trainPuff{0%{transform:scale(.35);opacity:.95}100%{transform:scale(2.4) translateY(-30%);opacity:0}}
/* crouch, spring up (stretch), land with a little squash — the copy is always at least as large as the painted owl */
/* a bounce in place: crouch, spring tall, land with a squash — never smaller than the painted owl, so nothing behind it shows */
@keyframes hop{0%,50%,100%{transform:scale(1,1)}57%{transform:scale(1.05,1)}66%{transform:scale(1,1.075)}74%{transform:scale(1,1.035)}82%{transform:scale(1.045,1)}90%{transform:scale(1,1.015)}}

@keyframes bobTalk{50%{transform:translateY(-1.2%) rotate(-.6deg)}}
.lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fbf3e8,#ecdcc6 60%,#c9ab88);box-shadow:inset 0 -.12em 0 #5a3a1c;transform:scaleY(0);transform-origin:50% 0;animation:blink 4.2s infinite}
@keyframes blink{0%,88%,100%{transform:scaleY(0)}91%,93%{transform:scaleY(1)}96%{transform:scaleY(0)}}
.puff{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(236,236,244,.55) 55%,rgba(230,230,240,0) 72%);animation:puff 3.4s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:0;transform:scale(.3)}12%{opacity:.9}100%{opacity:0;transform:translate(-30%,-220%) scale(2.6)}}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,236,170,.8),rgba(255,190,90,.3) 42%,rgba(255,180,80,0) 70%);animation:flicker 2.6s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.75;transform:scale(1)}35%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.07)}}
.spark{position:absolute;pointer-events:none;color:#fff6c2;text-shadow:0 0 .5em #ffd76a;animation:spark 2.8s ease-in-out infinite;opacity:0}
@keyframes spark{40%{opacity:1;transform:scale(1.25) rotate(35deg)}80%{opacity:0;transform:scale(.4) rotate(80deg)}}
.dust{position:absolute;width:.45%;aspect-ratio:1;border-radius:50%;background:#fff6d0;box-shadow:0 0 .5em #ffe9a8;pointer-events:none;opacity:0;animation:dust linear infinite}
@keyframes dust{10%{opacity:.85}90%{opacity:.5}to{opacity:0;transform:translate(2em,-14em)}}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:repeating-linear-gradient(115deg,rgba(255,240,200,0) 0 6%,rgba(255,240,200,.35) 8%,rgba(255,240,200,0) 11% 22%);background-size:220% 100%;animation:rays 16s linear infinite}
@keyframes rays{to{background-position:-220% 0}}
.shine{position:absolute;pointer-events:none;overflow:hidden;border-radius:2em}

   that are about the text the learner read (key ideas and words from that passage), not copied from it and not padded. */
function checkWriting(text,b){const issues=[],low=text.toLowerCase(),words=(text.match(/[A-Za-z']+/g)||[]),wl=words.map(w=>w.toLowerCase()),wc=words.length;
 const sents=text.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
 // 1. real words (not keyboard mashing or random letters)
 const junk=wl.filter(w=>w.length>2&&(!/[aeiouy]/.test(w)||/([a-z])\1\1/.test(w)||/[bcdfghjklmnpqrstvwxz]{5,}/.test(w)));
 if(wc&&junk.length/wc>.12)issues.push(`Some words are not real words (for example “${junk.slice(0,3).join('”, “')}”). Write in clear, correct English.`);
 // 2. no padding: the same word or sentence repeated
 const freq={};wl.forEach(w=>{if(!STOP.has(w)&&w.length>2)freq[w]=(freq[w]||0)+1});const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
 if(top&&wc>=20&&top[1]/wc>.15)issues.push(`The word “${top[0]}” is repeated too many times (${top[1]}×). Use different words to explain your ideas.`);
 const norm=sents.map(s=>s.toLowerCase().replace(/[^a-z ]/g,'').trim()),dup=norm.filter((s,i)=>s&&norm.indexOf(s)!==i);
 if(dup.length)issues.push('Some sentences are repeated. Every sentence should add a new idea.');
 // 3. complete sentences, not lists of words
 const shortS=sents.filter(s=>s.split(/\s+/).length<4);if(sents.length&&shortS.length/sents.length>.4)issues.push('Many sentences are too short. Write complete sentences with a subject and a verb.');
 if(sents.length<2)issues.push('Write your ideas in complete sentences that end with a period (.), question mark (?) or exclamation point (!).');
 if(b&&b.paragraphs){const src=b.paragraphs.join(' ').toLowerCase(),srcW=(src.match(/[a-z']+/g)||[]);
  // 4. about THIS text: it must use the passage's own key words and ideas
  const keys=new Set(srcW.filter(w=>w.length>=5&&!STOP.has(w))),title=new Set((b.title.toLowerCase().match(/[a-z']+/g)||[]).filter(w=>w.length>=4&&!STOP.has(w)));
  const used=new Set(wl.filter(w=>keys.has(w)||title.has(w))),need=Math.max(3,Math.min(8,Math.round(wc/18)));
  if(used.size<need)issues.push(`Your writing does not show enough of “${b.title}”. Use at least ${need} important words or ideas from the text (you used ${used.size}${used.size?': '+[...used].slice(0,5).join(', '):''}).`);
  // every sentence (except a short opinion line) should connect to the passage
  const off=sents.filter(s=>{const sw=(s.toLowerCase().match(/[a-z']+/g)||[]);return sw.length>=6&&!sw.some(w=>keys.has(w)||title.has(w))});
  if(sents.length>=3&&off.length/sents.length>.5)issues.push(`Most of your sentences are not about the text. Example of an off-topic sentence: “${off[0].slice(0,80)}${off[0].length>80?'…':''}”`);
  // 5. own words: not copied from the passage (7-word sequences that appear in the text)
  const grams=new Set();for(let i=0;i+7<=srcW.length;i++)grams.add(srcW.slice(i,i+7).join(' '));let cp=0;for(let i=0;i+7<=wl.length;i++)if(grams.has(wl.slice(i,i+7).join(' ')))cp++;
  const cov=wl.length>=7?cp/(wl.length-6):0;if(cov>.3)issues.push(`About ${Math.round(cov*100)}% of your writing is copied word-for-word from the passage. Explain the ideas in your own words.`)}
 return issues}
function rubric(text,c,b){const task=b?taskOf(b):PLACE_TASK,[minS,maxS]=b?SENT[c]:[3,6],minW=b?MINW[c]:30;
 const words=(text.match(/[A-Za-z']+/g)||[]),wc=words.length,sents=sentencesOf(text),sc=sents.length,low=text.toLowerCase();
 const src=b?b.paragraphs.join(' '):PLACE.paragraphs.join(' ');const keys=new Set((src.toLowerCase().match(/[a-z']{5,}/g)||[]).filter(w=>!STOP.has(w)));
 const used=new Set(words.map(w=>w.toLowerCase()).filter(w=>keys.has(w))).size;
 const links=LINKS.filter(l=>new RegExp('\\b'+l.replace(' ','\\s+')+'\\b').test(low)).length+(task.starters||[]).filter(s=>low.includes(s.toLowerCase().replace(/[,.…]/g,''))).length;
 const good=sents.filter(s=>/^["“']?[A-Z]/.test(s)&&/[.!?]["”']?$/.test(s)).length,gr=sc?good/sc:0,lowerI=/(^|\s)i(\s|')/.test(text);
 const uniq=wc?new Set(words.map(w=>w.toLowerCase())).size/wc:0,long=words.filter(w=>w.length>=7).length;

 const ideas=wc<8?1:cl(1+2.4*Math.min(1,sc/minS)+1.6*Math.min(1,used/4));
 const org=wc<8?1:cl(1+Math.min(3,links)+(sc>=minS?1:0));

 const strengths=[],tips=[];
 (ideas>=4?strengths:tips).push(ideas>=4?`You used important ideas from the text (${used} key words).`:`Add more details from the text — aim for ${minS}–${maxS} sentences (you have ${sc}).`);

 (gram>=4?strengths:tips).push(gram>=4?'Your sentences start with capitals and end with punctuation.':'Check capital letters and full stops in every sentence.');
 (vocab>=4?strengths:tips).push(vocab>=4?'You chose varied, precise words.':'Try a more precise word instead of repeating the same ones.');
 if(wc<minW)tips.unshift(`Write at least ${minW} words (you have ${wc}).`);

 const fix=s=>{s=s.replace(/(^|\s)i(\s|')/g,'$1I$2').trim();s=s.charAt(0).toUpperCase()+s.slice(1);return /[.!?]["”']?$/.test(s)?s:s+'.'};

function fit(sc){const W=innerWidth,H=innerHeight,pl=sc.querySelector('.plate');
  sc.style.setProperty('--scene-bg',`url("${ART}${sc.dataset.key}.jpg")`);
  document.documentElement.style.setProperty('--toolbar-h','0px');

  const aw=AW,ah=AH,key=sc.dataset.key;
  // Edge-to-edge (cover) fit. One scale k and one offset place the picture and every element on it; the scale only drops
  // below cover when that would cut into the safe rectangle (every painted title, label, button and card), so only outer

  const FULL_BLEED_SAFE={rw01:[12,6,1500,830],rw02:[10,4,1516,848]};
  const safe=FULL_BLEED_SAFE[key]||[0,0,AW,AH];
  const [sx,sy,sw,sh]=safe,coverK=Math.max(W/aw,H/ah),safeK=Math.min(W/sw,H/sh);
  const k=Math.min(coverK,safeK),w=aw*k,h=ah*k;
  const minX=Math.max(W-w,-sx*k),maxX=Math.min(0,W-(sx+sw)*k);
  const minY=Math.max(H-h,-sy*k),maxY=Math.min(0,H-(sy+sh)*k);
  const left=minX<=maxX?Math.max(minX,Math.min(maxX,(W-w)/2)):(W-w)/2;
  const top=minY<=maxY?Math.max(minY,Math.min(maxY,(H-h)/2)):(H-h)/2;
  sc.classList.toggle('safe-fit',!!FULL_BLEED_SAFE[key]);
  sc.querySelectorAll('.safe-extension').forEach(e=>e.remove());
  sc.style.setProperty('--plate-w',w+'px');sc.style.setProperty('--plate-h',h+'px');sc.style.setProperty('--plate-left',left+'px');sc.style.setProperty('--plate-top',top+'px');sc.style.setProperty('--plate-k',k+'px');sc.style.setProperty('--k',k+'px');
  Object.assign(pl.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px',fontSize:k+'px',transformOrigin:'0 0',transform:'none'});
  const art=pl.querySelector(':scope>.art');if(art)Object.assign(art.style,{left:'0',top:'0',width:w+'px',height:h+'px',clipPath:'none'});
  sc.querySelectorAll('.ext').forEach(e=>e.style.display='none');
  pl.querySelectorAll('[data-toolbar],[data-toolbar-nav]').forEach(el=>{
   const x=+(el.dataset.x||0),y=+(el.dataset.y||0),ew=+(el.dataset.w||0),eh=+(el.dataset.h||0),fs=+(el.dataset.fs||0);
   el.style.position='absolute';el.style.left=(x*k)+'px';el.style.top=(y*k)+'px';el.style.width=(ew*k)+'px';el.style.height=(eh*k)+'px';if(fs)el.style.fontSize=(fs*k)+'px';el.style.zIndex=el.dataset.toolbarNav?'71':'70';
  });
}

 const back=document.createElement('button');back.type='button';back.id='rl-progress-backdrop';back.setAttribute('aria-label','Close My Progress');

 const tab=document.createElement('button');tab.type='button';tab.id='rl-progress-toggle';tab.className='hit';tab.setAttribute('aria-expanded','false');tab.setAttribute('aria-controls','rl-progress-drawer');tab.setAttribute('aria-label','Open My Progress');

 tab.onclick=e=>{e.stopPropagation();if(Date.now()<_progSuppressClick)return;try{ac();SFX.pop()}catch(_){ }setProgressOpen(!_progIsOpen())};
 back.onclick=()=>setProgressOpen(false);
 dr.querySelector('.prog-close')?.addEventListener('click',()=>setProgressOpen(false));
 _progBindDrag(tab,{openOnLeft:true,closeOnRight:true});

}
